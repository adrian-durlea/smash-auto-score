[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smash-auto-score"
version = "0.1.0"
description = "Conservative tournament broadcast score controller"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic-settings>=2", "numpy>=1.26", "opencv-python-headless>=4.9", "rapidfuzz>=3", "obsws-python>=1.7", "pytesseract>=0.3.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
smash-auto-score = "smash_auto_score.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smash_auto_score = ["dashboard.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
