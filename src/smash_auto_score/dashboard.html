<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smash AutoScore</title>
<style>
:root{font:15px system-ui,sans-serif;color:#ecf0ff;background:#111827}*{box-sizing:border-box}body{max-width:1150px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}p{color:#a8b3c8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#1d293b;border:1px solid #34435b;border-radius:12px;padding:18px}.score{font-size:34px;font-weight:700;display:flex;justify-content:space-between}.badge{padding:4px 8px;border-radius:6px;background:#334155}.bad{background:#7f1d1d}.good{background:#14532d}button,select{background:#334155;color:white;border:1px solid #64748b;border-radius:7px;padding:9px 12px;cursor:pointer;margin:4px 3px 4px 0}button:hover{background:#475569}button.danger{background:#7f1d1d}button.primary{background:#155e75}.muted{color:#9caac0;font-size:13px}pre{white-space:pre-wrap;max-height:250px;overflow:auto;font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}#notice{min-height:24px;color:#fbbf24}.tiny{font-size:12px}
</style>
<h1>Smash AutoScore</h1><p>Conservative broadcast controller · local dashboard</p><div id="notice"></div>
<div class="grid">
<section class="card"><h2>Current set</h2><div id="connection"></div><div id="set"></div><div id="score" class="score"></div><div id="round" class="muted"></div><button onclick="act('/api/score/left')">Left player won</button><button onclick="act('/api/score/right')">Right player won</button><button onclick="act('/api/undo')" class="danger">Undo last score</button></section>
<section class="card"><h2>Automation</h2><div id="phase"></div><div id="armed"></div><button onclick="act('/api/arm/true')" class="primary">Arm auto score</button><button onclick="act('/api/arm/false')">Disarm</button><div><label>Next set <select id="mode" onchange="setMode()"><option>OFF</option><option selected>SUGGEST</option><option>AUTO</option></select></label></div><button onclick="act('/api/reset-game')">Reset game state</button><button onclick="act('/api/reset-set')">Reset set state</button></section>
<section class="card"><h2>Player mapping</h2><div id="mapping"></div><div id="observed" class="muted"></div><button onclick="post('/api/mapping',{p1_is_left:true})">P1 = left</button><button onclick="post('/api/mapping',{p1_is_left:false})">P1 = right</button><button onclick="act('/api/swap')">Swap TSH players</button><div id="evidence" class="tiny"></div><details><summary>Save player aliases and characters</summary><select id="override-side"><option value="left">Left</option><option value="right">Right</option></select><input id="aliases" placeholder="Aliases, comma separated"><input id="characters" placeholder='Characters JSON, e.g. {"fox":0.8}'><button onclick="savePlayer()">Save player</button></details></section>
<section class="card"><h2>Next set</h2><div id="candidate"></div><button onclick="act('/api/next/suggest')">Find candidate</button><button onclick="act('/api/next/load')" class="primary">Load candidate</button><button onclick="act('/api/next/ignore')">Ignore</button></section>
<section class="card"><h2>Recent events</h2><pre id="events"></pre></section>
<section class="card"><h2>Calibration</h2><div id="video"></div><select id="roi-name"><option>p1_tag</option><option>p2_tag</option><option>p1_hud</option><option>p2_hud</option><option>gameplay</option><option>game_set</option><option>result</option><option>winner</option></select><button onclick="saveRois()">Save regions</button><button onclick="loadFrame()">Refresh frame</button><button onclick="testRoi()">Test region</button><div id="roi-result" class="muted"></div><canvas id="calibration-canvas" style="width:100%;border:1px solid #64748b;touch-action:none"></canvas><div class="muted">Drag a region on the frame, select each name, then save. Winner detection requires tournament footage validation.</div></section>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(url,body){try{const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await r.json();$('notice').textContent=r.ok?'':(data.detail||'Request failed');await refresh()}catch(e){$('notice').textContent=String(e)}}
async function act(url){return post(url,{})}async function setMode(){return post('/api/mode',{mode:$('mode').value})}
async function savePlayer(){try{return post('/api/player-override',{side:$('override-side').value,aliases:$('aliases').value.split(',').map(s=>s.trim()).filter(Boolean),character_distribution:JSON.parse($('characters').value||'{}')})}catch(e){$('notice').textContent='Invalid character JSON: '+e}}
async function refresh(){try{const r=await fetch('/api/status');const s=await r.json();$('connection').innerHTML=`<span class="badge ${s.connected?'good':'bad'}">TSH ${s.connected?'connected':'disconnected'}</span>`;$('set').innerHTML=s.set?`${esc(s.set.left.display_name)} vs ${esc(s.set.right.display_name)}`:'No set';$('score').innerHTML=s.set?`<span>${s.set.left_score}</span><span>${s.set.right_score}</span>`:'';$('round').textContent=s.set?`${s.set.event||''} ${s.set.round||''} · BO${s.set.best_of}`:'';$('phase').textContent='Game state: '+s.phase;$('armed').innerHTML=`<span class="badge ${s.armed?'good':'bad'}">Auto score ${s.armed?'ARMED':'DISARMED'}</span>`;$('mode').value=s.set_mode;const m=s.mapping;$('mapping').textContent=m.p1_is_left===null?'P1 = ? · P2 = ?':`P1 = ${m.p1_is_left?'left':'right'} · P2 = ${m.p1_is_left?'right':'left'} · ${(m.confidence*100).toFixed(0)}%${m.conflict?' · CONFLICT':''}`;$('evidence').innerHTML=m.evidence.map(e=>`<div>${esc(e.source)}: ${esc(e.description)} (${(e.confidence*100).toFixed(0)}%)</div>`).join('');$('observed').textContent='Tags: '+JSON.stringify(s.observation.tags)+' · Colors: '+JSON.stringify(s.observation.colors)+' · Characters: '+JSON.stringify(s.observation.characters);const n=s.next_candidate;$('candidate').textContent=n?`${n.players.join(' vs ')} · ${(n.confidence*100).toFixed(0)}% · ${n.reasons.join(', ')}`:'No candidate';$('events').textContent=s.events.map(e=>new Date(e.created*1000).toLocaleTimeString()+' '+e.kind+' '+e.detail).join('\n');$('video').textContent=`Video: ${s.video.connected?'connected':'disconnected'} · ${s.video.source||'none'} · ${s.video.error||''}`;if(s.error)$('notice').textContent=s.error}catch(e){$('notice').textContent='Dashboard connection failed: '+e}}
let rois={},picture=null,start=null;const canvas=$('calibration-canvas'),ctx=canvas.getContext('2d');
function draw(){if(!picture)return;canvas.width=picture.width;canvas.height=picture.height;ctx.drawImage(picture,0,0);for(const [name,r] of Object.entries(rois)){ctx.strokeStyle=name===$('roi-name').value?'#facc15':'#4ade80';ctx.lineWidth=3;ctx.strokeRect(r.x*canvas.width,r.y*canvas.height,r.w*canvas.width,r.h*canvas.height);ctx.fillStyle=ctx.strokeStyle;ctx.fillText(name,r.x*canvas.width,r.y*canvas.height+12)}}
function point(e){const b=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),y:Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))}}
canvas.onpointerdown=e=>{start=point(e);canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=e=>{if(!start)return;const end=point(e),x=Math.min(start.x,end.x),y=Math.min(start.y,end.y),w=Math.abs(end.x-start.x),h=Math.abs(end.y-start.y);if(w>.01&&h>.01)rois[$('roi-name').value]={x,y,w,h};start=null;draw()};$('roi-name').onchange=draw;
async function loadFrame(){const img=new Image();img.onload=()=>{picture=img;draw()};img.onerror=()=>{$('notice').textContent='No frame available';};img.src='/api/frame?t='+Date.now()}
async function loadRois(){try{rois=(await (await fetch('/api/calibration')).json()).rois||{};draw()}catch(e){$('notice').textContent=String(e)}}
async function saveRois(){const r=await fetch('/api/calibration',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({rois})});$('notice').textContent=r.ok?'Regions saved':(await r.json()).detail}
async function testRoi(){await saveRois();const r=await fetch('/api/calibration/test/'+$('roi-name').value);$('roi-result').textContent=JSON.stringify(await r.json())}
refresh();loadRois();loadFrame();setInterval(refresh,2000);
</script></html>
